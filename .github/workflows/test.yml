name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install --upgrade pip && pip install ".[dev]"
      - name: Unit tests (providers mocked, no network)
        run: python -m pytest -q
      - name: Command-line smoke test
        run: |
          bibaifilter --version
          bibaifilter models
          bibaifilter baseline examples/sample_records.csv --query "generative AI school education" --label-col included

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Type-check and build the interface
        working-directory: web
        run: npm ci --no-audit --no-fund && npx tsc --noEmit && npm run build:static
